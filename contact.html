<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 0L95.1 19.5V56.2C95.1 82 75.8 100 50 100C24.2 100 4.9 82 4.9 56.2V19.5L50 0Z' fill='%2327C690'/%3E%3Cpath d='M50 83.3C50 83.3 68.8 70.8 68.8 56.2V33.2L50 25L31.2 33.2V56.2C31.2 70.8 50 83.3 50 83.3Z' fill='white'/%3E%3Cpath d='M55.2 46.9H51V42.7C51 42.1 50.5 41.7 50 41.7C49.5 41.7 49 42.1 49 42.7V46.9H44.8C44.3 46.9 43.8 47.3 43.8 47.9C43.8 48.5 44.3 48.9 44.8 48.9H49V53.1C49 53.7 49.5 54.1 50 54.1C50.5 54.1 51 53.7 51 53.1V48.9H55.2C55.7 48.9 56.2 48.5 56.2 47.9C56.2 47.3 55.7 46.9 55.2 46.9Z' fill='%2327C690'/%3E%3C/svg%3E">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - Healthub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'primary-green': '#27C690',
              'primary-green-dark': '#21A87A',
            }
          }
        }
      }
    </script>
     <link rel="stylesheet" href="css/style.css">
     <script type="importmap">
     {
       "imports": {
         "@google/genai": "https://aistudiocdn.com/@google/genai@^1.19.0"
       }
     }
     </script>
</head>
<body class="bg-light-gray-bg min-h-screen flex flex-col">
    <header class="w-full bg-white p-3 z-20 shadow-md">
      <div class="container mx-auto flex justify-between items-center">
        <a href="index.html" class="flex items-center space-x-2 cursor-pointer">
          <svg class="w-10 h-10" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 0L95.1 19.5V56.2C95.1 82 75.8 100 50 100C24.2 100 4.9 82 4.9 56.2V19.5L50 0Z" fill="#27C690"/>
            <path d="M50 83.3C50 83.3 68.8 70.8 68.8 56.2V33.2L50 25L31.2 33.2V56.2C31.2 70.8 50 83.3 50 83.3Z" fill="white"/>
            <path d="M55.2 46.9H51V42.7C51 42.1 50.5 41.7 50 41.7C49.5 41.7 49 42.1 49 42.7V46.9H44.8C44.3 46.9 43.8 47.3 43.8 47.9C43.8 48.5 44.3 48.9 44.8 48.9H49V53.1C49 53.7 49.5 54.1 50 54.1C50.5 54.1 51 53.7 51 53.1V48.9H55.2C55.7 48.9 56.2 48.5 56.2 47.9C56.2 47.3 55.7 46.9 55.2 46.9Z" fill="#27C690"/>
          </svg>
          <span class="text-xl font-bold text-gray-800 tracking-wide">Health Hub</span>
        </a>
        <nav class="hidden md:flex items-center">
          <a href="index.html" class="text-gray-600 hover:text-primary-green transition-colors duration-300 px-3 py-2 rounded-md text-sm font-semibold">Home</a>
          <a href="about.html" class="text-gray-600 hover:text-primary-green transition-colors duration-300 px-3 py-2 rounded-md text-sm font-semibold">About us</a>
          <a href="contact.html" class="text-gray-600 hover:text-primary-green transition-colors duration-300 px-3 py-2 rounded-md text-sm font-semibold">Contact us</a>
          <a href="register.html" class="ml-4 text-white bg-primary-green hover:bg-primary-green-dark transition-colors duration-300 font-bold py-2 px-4 rounded-md text-sm shadow-sm">Register</a>
        </nav>
      </div>
    </header>

    <div class="w-full flex-grow flex items-center justify-center p-4 sm:p-8 bg-gradient-to-br from-cyan-200 via-pink-200 to-orange-200 relative overflow-hidden">
        <div class="absolute -top-10 -left-10 w-48 h-48 bg-white/20 rounded-full animate-pulse"></div>
        <div class="absolute -bottom-20 -right-10 w-72 h-72 bg-white/20 rounded-full animate-pulse delay-75"></div>
        <span class="absolute top-1/4 left-1/4 text-8xl text-white/10 font-black select-none">+</span>
        <span class="absolute bottom-1/4 right-1/4 text-8xl text-white/10 font-black select-none">+</span>

        <main class="w-full max-w-5xl bg-white/30 backdrop-blur-xl rounded-3xl shadow-2xl p-6 sm:p-8 border border-white/40 z-10 grid md:grid-cols-2 gap-12 items-center">
        
        <div class="bg-white/40 rounded-2xl p-8 flex flex-col justify-center h-full text-gray-800 space-y-8 shadow-lg">
            <h2 class="text-4xl font-bold text-center">Reach us</h2>
            <div class="space-y-4">
            <div>
                <h3 class="text-xl font-bold">Email :</h3>
                <p class="mt-1">gohealthhub.360@gmail.com</p>
            </div>
            <div>
                <h3 class="text-xl font-bold">Address :</h3>
                <p class="mt-1">
                fourth floor, einstein bhavan, near pencil canteen, Aditya polytechnic college,Surampalem.
                </p>
            </div>
            </div>
            <div class="flex justify-center gap-8 pt-4">
                <div class="w-16 h-16 rounded-full bg-red-400 text-white flex items-center justify-center shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <div class="w-16 h-16 rounded-full bg-blue-400 text-white flex items-center justify-center shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                </div>
            </div>
        </div>

        <div class="p-4">
            <form id="contact-form" class="space-y-6">
            <div>
                <label for="name" class="block text-lg font-bold text-gray-800">Name</label>
                <input id="name" name="name" type="text" required class="mt-1 block w-full px-5 py-3 bg-white/80 border-0 rounded-full shadow-inner placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-green sm:text-sm text-gray-900" placeholder="name">
            </div>
            <div>
                <label for="email" class="block text-lg font-bold text-gray-800">Email</label>
                <input id="email" name="email" type="email" required class="mt-1 block w-full px-5 py-3 bg-white/80 border-0 rounded-full shadow-inner placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-green sm:text-sm text-gray-900" placeholder="email">
            </div>
            <div>
                <label for="message" class="block text-lg font-bold text-gray-800">Message</label>
                <textarea id="message" name="message" rows="5" required class="mt-1 block w-full px-5 py-3 bg-white/80 border-0 rounded-full shadow-inner placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-green sm:text-sm text-gray-900 rounded-2xl resize-none"></textarea>
            </div>
            <div class="text-center pt-2">
                <button type="submit" class="w-1/2 flex items-center justify-center gap-2 py-3 px-4 border border-transparent rounded-full shadow-lg text-sm font-bold text-white bg-gradient-to-r from-green-400 to-teal-500 hover:from-green-500 hover:to-teal-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-all transform hover:scale-105">
                    Submit 
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                    </svg>
                </button>
            </div>
            </form>
        </div>
        </main>
    </div>

    <footer class="w-full bg-white p-2 text-center text-sm text-gray-800 font-semibold border-t border-gray-200">
      Developed by Team 9
    </footer>
    <script type="module" src="js/contact.js"></script>
</body>
</html>
